<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eeebe3">
    <title>KAJTEK</title>
    <meta name="description" content="KAJTEK - internet radio">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon.ico" sizes="any">
  </head>
  <body>
    <div class="kajtek-app">
      <header class="kajtek-header">
        <div class="header-brand">
          <span class="brand-name">KAJTEK</span>
          <span class="brand-sub">radio internetowe</span>
        </div>
        <div class="header-actions">
          <button id="dark-toggle" type="button" class="dark-toggle" aria-label="Przełącz tryb ciemny/jasny">
            <span class="dark-toggle-knob">
              <span class="dark-toggle-icon">
                <svg
                  class="icon-sun"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round">
                  <title>Tryb jasny</title>
                  <circle cx="12" cy="12" r="4"></circle>
                  <path
                    d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <title>Tryb ciemny</title>
                  <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
                </svg>
              </span>
            </span>
          </button>
          <button id="settings-toggle" type="button" class="settings-toggle" aria-label="Ustawienia">
            <span class="settings-toggle-knob">
              <svg
                class="settings-toggle-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <title>Ustawienia</title>
                <circle cx="12" cy="12" r="3"></circle>
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </span>
          </button>
        </div>
      </header>

      <main class="kajtek-main">
        <section class="np-panel" aria-label="Odtwarzacz radiowy">
          <div class="side-buttons" aria-hidden="true">
            <span class="side-nub"></span>
            <span class="side-nub"></span>
            <span class="side-nub"></span>
          </div>

          <div id="vu-strip" class="vu-strip" aria-hidden="true"></div>

          <div class="np-body">
            <div class="kajtek-stripe" aria-hidden="true">
              <span>K</span><span>A</span><span>J</span><span>T</span><span>E</span><span>K</span>
            </div>
            <div id="reel-left" class="tape-reel" aria-hidden="true"><div class="reel-hub"></div></div>
            <div id="album-art" class="album-art empty" aria-hidden="true">
              <span class="album-art-initial">?</span>
              <div class="album-art-overlay">
                <button
                  type="button"
                  id="np-fav-star"
                  class="sc-star np-fav-star"
                  title="Ulubione"
                  aria-label="Ulubione"
                  hidden></button>
                <button
                  type="button"
                  id="np-block-btn"
                  class="sc-star np-block-btn"
                  title="Zablokuj"
                  aria-label="Zablokuj"
                  hidden></button>
              </div>
            </div>
            <div class="np-info" aria-live="polite">
              <div id="np-short-row" class="np-short-row hidden">
                <span id="np-short" class="np-short-val">—</span>
                <span id="np-live-dot" class="np-live-dot"></span>
              </div>
              <div id="np-station" class="np-station empty">wybierz stację</div>
              <div id="np-track" class="np-track">
                <div id="np-artist" class="np-artist">—</div>
                <span id="np-title" class="np-title">—</span>
              </div>
            </div>
            <div id="reel-right" class="tape-reel" aria-hidden="true"><div class="reel-hub"></div></div>
            <div class="np-tape-scale" aria-hidden="true">END · 100 · 50 · 0 · START</div>
          </div>

          <div class="np-controls">
            <button type="button" id="play-btn" class="play-btn" disabled aria-label="Odtwarzaj"></button>
            <div class="np-branding" aria-hidden="true">
              <div class="unitra-sub"><span class="u-box">U</span> UNITRA zrk</div>
              <div class="stereo-title">STEREO</div>
              <div class="cassette-sub">CASSETTE PLAYER PS 101</div>
            </div>
            <button
              type="button"
              id="history-toggle-btn"
              class="history-btn"
              aria-expanded="false"
              aria-controls="history-panel">
              <span>PROGRAM</span>
              <span class="history-arrow" aria-hidden="true">▼</span>
            </button>
          </div>

          <div id="history-panel" class="history-panel">
            <div class="history-clip">
              <div class="history-inner">
                <div class="history-head">
                  <div class="history-tabs">
                    <button type="button" class="history-tab active" data-history-tab="program">PROGRAM</button>
                    <button type="button" class="history-tab" data-history-tab="favorites">
                      ULUBIONE<span id="fav-tab-count" class="fav-tab-count">0</span>
                    </button>
                  </div>
                  <span class="k-rule"></span>
                  <span id="history-clock" class="history-clock"></span>
                </div>
                <div id="program-view" class="history-view active">
                  <div id="blacklist-warning" class="bl-warn">
                    <div class="bl-warn-clip">
                      <div id="blacklist-warning-content" class="bl-warn-content"></div>
                    </div>
                  </div>
                  <div id="history-empty" class="history-empty">Program pojawi się po wybraniu stacji…</div>
                  <div id="history-list"></div>
                </div>
                <div id="favorites-view" class="history-view">
                  <div id="favorites-empty" class="history-empty">
                    Brak ulubionych — kliknij ★ przy utworze w PROGRAM
                  </div>
                  <div id="favorites-list"></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="controls-row">
          <section id="volume-panel" class="k-panel" aria-label="Panel głośności">
            <div class="k-head"><span class="k-label">Głośność</span><span class="k-rule"></span></div>
            <div class="volume-row">
              <button type="button" id="mute-btn" class="mute-btn" aria-label="Wycisz"></button>
              <div class="vol-wrap">
                <div id="vol-ladder" class="vol-ladder" aria-hidden="true"></div>
                <input
                  id="vol-slider"
                  type="range"
                  class="vol-slider"
                  min="0"
                  max="100"
                  value="10"
                  aria-label="Suwak głośności">
              </div>
              <span id="vol-val" class="vol-val">10</span>
            </div>
          </section>

          <section class="k-panel" aria-label="Wyłącznik czasowy">
            <div class="k-head"><span class="k-label">Sleep timer</span><span class="k-rule"></span></div>
            <div class="sleep-keys">
              <button type="button" class="sleep-key btn-key" data-min="15" aria-label="Wyłącz za 15 minut">
                <span class="sleep-val">15</span><span class="sleep-unit">min</span>
              </button>
              <button type="button" class="sleep-key btn-key" data-min="30" aria-label="Wyłącz za 30 minut">
                <span class="sleep-val">30</span><span class="sleep-unit">min</span>
              </button>
              <button type="button" class="sleep-key btn-key" data-min="60" aria-label="Wyłącz za 60 minut">
                <span class="sleep-val">60</span><span class="sleep-unit">min</span>
              </button>
              <button type="button" class="sleep-key btn-key" data-min="90" aria-label="Wyłącz za 90 minut">
                <span class="sleep-val">90</span><span class="sleep-unit">min</span>
              </button>
            </div>
            <div id="sleep-count" class="sleep-count"></div>
          </section>
        </div>

        <section id="station-list-container" class="station-list" aria-label="Lista stacji radiowych"></section>
      </main>

      <footer class="kajtek-footer">
        <p>Inspirowany Unitrą PS-101 · 2026 · <span id="version"></span></p>
        <p>Autor: Adrian Mokrzycki</p>
      </footer>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
